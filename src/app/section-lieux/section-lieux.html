<div class="section-lieux">

  <!-- État loading -->
  @if(loading) {
    <div class="section-lieux__loading">
      <div class="section-lieux__spinner"></div>
      <p>Chargement des lieux...</p>
    </div>
  }

  <!-- Contenu : affiché uniquement si pas en loading -->
  @if(!loading) {

    @if(points.length === 0) {
      <div class="section-lieux__vide">
        <p>Aucun lieu trouvé pour ces filtres.</p>
      </div>
    }

    @if(points.length > 0) {
      <p class="section-lieux__compteur">
        {{ points.length }} lieu(x) trouvé(s)
      </p>
      <div class="section-lieux__grille">
        @for(point of points; track point.id) {
          <app-carte-lieu [point]="point"></app-carte-lieu>
        }
      </div>
    }

  }

</div>
